playbook:
  id: ai-news-gtm
  name: "AI News — GTM"
  domain: ai-news
  default_query: "artificial intelligence"
  theme:
    gradient: "sky-violet"
    skin: "aurora"
    start: "#38BDF8"
    end: "#7C6CF0"
    accent: "#7C6CF0"
    brand: "AI Daily Brief · Prism"
  carousel:  # AI Dev Digest format v3 (Front Page) — the finalized production format
    # Skin rule (Venugopal, locked 2026-10-16–20): POSTER is the standing
    # default for EVERY edition (light bg, colored per-slot vertical bars).
    # frontpage = alternate light skin on request only; dark skins
    # (terminal, neon-grid, aurora) = special-occasion only. Rotation is
    # available only when a playbook explicitly sets skin_mode: rotation.
    skin: poster
    skin_mode: fixed
    title: "AI Dev Digest"
    brand_short: "AI DEV DIGEST"
    persona_name: "Venu Tati"
    persona_brand: "Venu Tati · AI Dev Digest"
    persona_position: "AI architect — I read the firehose so you don't have to."
    slots: [PRODUCT, FRAMEWORKS, REPO, RESEARCH, ECOSYSTEM]
    cta: ["Tomorrow's digest,", "same time, same place.", "Follow so you don't miss it."]
  audience:
    primary: "AI-curious professionals"
    tone: "clear, punchy, no hype"
  sources:
    - hn-frontpage
    - hn-algolia
    - reddit
    - gdelt
    - google-trends
    - editorial-rss
    - tavily-search
    - fetch
  # Research sweep — mirrors the production AI News pipeline
  # (ai-reel/detect/viral_watch.py): every source family is key-free and
  # failure-isolated; Scout queries ALL of them, merges + dedupes, and
  # counts cross-source corroboration into the Verification score.
  research:
    prefilter_keywords: [ai, artificial intelligence, llm, llms, gpt, chatgpt, claude,
      openai, anthropic, gemini, deepmind, nvidia, machine learning, neural,
      agent, agents, chatbot, model, models, robotics, automation]
    hn_frontpage: { limit: 60 }
    hn_search: { limit: 12 }
    tavily: true
    reddit:
      subreddits: [singularity, LocalLLaMA, artificial, ChatGPT]
      limit: 40
    gdelt:
      keywords: [OpenAI, '"artificial intelligence"', Anthropic, Nvidia]
      timespan: 24h
      maxrecords: 50
    trends: { geo: US }
    editorial:
      - { name: TLDR AI, url: "https://tldr.tech/api/rss/ai" }
      - { name: The Rundown AI, url: "https://www.therundown.ai/feed" }
      - { name: Simon Willison, url: "https://simonwillison.net/atom/everything/" }
      - { name: Latent Space, url: "https://www.latent.space/feed" }
  rubric:
    - { key: audience_heat, label: "Audience Heat", weight: 40 }
    - { key: consequence, label: "Consequence", weight: 20 }
    - { key: verification, label: "Verification", weight: 20 }
    - { key: novelty, label: "Novelty", weight: 20 }
  selection:
    floor_key: consequence
    floor_min: 10
  knowledge:
    - brand-voice.md
    - past-runs/
  makers: [briefing, reel_script, linkedin_carousel, linkedin_post, instagram_caption, email]
  review_rules:
    - every_claim_grounded_in_sources
    - no_story_covered_before
    - self_contained_for_a_new_viewer
    - tone_matches_playbook
  publish_targets: [run_page]
  human_gate: before_publish
