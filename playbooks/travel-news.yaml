playbook:
  id: travel-news
  name: "Travel News — GTM"
  domain: travel-news
  default_query: "travel destinations"
  theme:
    gradient: "sunset"
    skin: "aurora"
    start: "#FB923C"
    end: "#E879A9"
    accent: "#EA580C"
    brand: "Travel Brief · Prism"
  carousel:  # Same v3 Front Page structure as the Digest; sunset skin family
    title: "Travel Brief"
    brand_short: "TRAVEL BRIEF"
    persona_name: "Venu Tati"
    persona_brand: "Venu Tati · Travel Brief"
    persona_position: "I track routes, fares and seasons so you can just go."
    slots: [DESTINATIONS, DEALS, ROUTES, GUIDES, NEWS]
    cta: ["Tomorrow's brief,", "new routes, real deals.", "Follow so you don't miss it."]
  audience:
    primary: "Travel planners and deal hunters"
    tone: "warm, vivid, practical"
  sources:
    - tavily-travel
    - hn-algolia
    - fetch
  rubric:
    - { key: deal_value, label: "Deal Value", weight: 35 }
    - { key: urgency, label: "Urgency", weight: 20 }
    - { key: seasonality, label: "Seasonality", weight: 20 }
    - { key: verification, label: "Verification", weight: 25 }
  knowledge:
    - brand-voice.md
    - past-runs/
  makers: [briefing, linkedin_carousel, linkedin_post, email]
  review_rules:
    - every_claim_grounded_in_sources
    - no_story_covered_before
    - self_contained_for_a_new_viewer
    - tone_matches_playbook
  publish_targets: [run_page]
  human_gate: before_publish
